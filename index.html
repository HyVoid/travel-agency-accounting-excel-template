    <script>
      // GitHub Pages SPA trailing slash handler:
      // When visiting https://<user>.github.io/<repo> without trailing slash,
      // relative paths like ./assets/... will resolve to https://<user>.github.io/assets/... (404 Not Found).
      // This redirect ensures the browser path is https://<user>.github.io/<repo>/
      (function() {
        var pathname = window.location.pathname;
        if (!pathname.endsWith('/') && !pathname.split('/').pop().includes('.')) {
          window.location.replace(pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
